name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Scaffold packs rename PACK/EXAMPLE when copying from rigTemplate.
# Private RigKit host + sibling packs need org/repo secret RIGKIT_CI_TOKEN
# (PAT with Contents:read on rigkid/RigKit and in-org pack remotes).
env:
  PACK: rigTemplate
  EXAMPLE: demo

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check formatting
        run: |
          FILES=$(git ls-files '*.cpp' '*.h' '*.c' '*.hpp' | grep -vE '(^|/)third_party/' || true)
          EXISTING=""
          for file in $FILES; do
            [ -f "$file" ] && EXISTING="$EXISTING $file"
          done
          if [ -n "$EXISTING" ]; then
            echo "Checking clang-format on:$EXISTING"
            clang-format --dry-run --Werror $EXISTING
          else
            echo "No source files to check."
          fi

  example:
    runs-on: ubuntu-latest
    steps:
      - name: Check private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::warning::No RIGKIT_CI_TOKEN. Public remotes still clone; jobs that reach a private in-org pack will fail later. Fine-grained PAT with Contents:read on rigkid/RigKit and the in-org packs, set as an org secret (visibility: all repositories) or a repo secret. On GitHub Free, private repos never receive org secrets - they need a repo secret."
          fi

      - name: Checkout pack
        uses: actions/checkout@v4
        with:
          path: pack

      - name: Checkout RigKit host
        uses: actions/checkout@v4
        with:
          repository: rigkid/RigKit
          path: host
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN || github.token }}

      - name: Overlay pack under test
        run: |
          rm -rf "host/packs/${PACK}"
          mkdir -p host/packs
          cp -a pack "host/packs/${PACK}"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Configure example
        working-directory: host
        run: >
          cmake -S "packs/${PACK}/examples/${EXAMPLE}"
          -B "packs/${PACK}/examples/${EXAMPLE}/build"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build example
        working-directory: host
        run: cmake --build "packs/${PACK}/examples/${EXAMPLE}/build"
