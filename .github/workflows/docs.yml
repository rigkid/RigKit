name: Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Site root + API HTML → https://rigkid.github.io/rigkit/ (+ /api/)
# One-time: repo Settings → Pages → Source: GitHub Actions.
# Private Pages need an org plan that allows them (or public remotes).

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-rigkit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout host
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch optional pack remotes for aggregate docs
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x tools/fetch-packs-for-docs.sh
          ./tools/fetch-packs-for-docs.sh

      - name: Install Doxygen and configure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev \
            libwayland-dev libwayland-bin libxkbcommon-dev

      - name: Configure and generate docs
        run: |
          cmake -S . -B build
          cmake --build build --target docs

      - name: Assemble Pages site
        run: |
          mkdir -p _site/api
          cp site/index.html site/styles.css site/field.js _site/
          cp -a build/docs/api/html/. _site/api/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
