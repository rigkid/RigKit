name: CI

on:
  pull_request:
  push:
    branches: [ main ]

# Private in-org pack remotes (and pack CI → host) need a PAT with Contents:read
# on rigkid/RigKit + packs. Set org or repo secret RIGKIT_CI_TOKEN.
# Default GITHUB_TOKEN cannot clone sibling private repositories.

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Ten Commandments invariants
        run: |
          chmod +x tools/check-invariants.sh
          ./tools/check-invariants.sh
      - name: Check formatting
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}
          else
            BASE=$(git rev-parse HEAD~1 2>/dev/null || true)
          fi

          if [ -z "$BASE" ]; then
            FILES=$(git ls-files '*.cpp' '*.h' '*.c' '*.hpp' | grep -vE '^(third_party|assets|packs)/' || true)
          else
            FILES=$(git diff --name-only "$BASE" HEAD -- '*.cpp' '*.h' '*.c' '*.hpp' | grep -vE '^(third_party|assets|packs)/' || true)
          fi

          EXISTING_FILES=""
          for file in $FILES; do
            if [ -f "$file" ]; then
              EXISTING_FILES="$EXISTING_FILES $file"
            fi
          done

          if [ -n "$EXISTING_FILES" ]; then
            echo "Checking clang-format on:$EXISTING_FILES"
            clang-format --dry-run --Werror $EXISTING_FILES
          else
            echo "No source files to check. Skipping clang-format."
          fi

  headless:
    runs-on: ubuntu-latest
    steps:
      - name: Require private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::error::Missing secret RIGKIT_CI_TOKEN. Create a fine-grained PAT with Contents:read on rigkid/RigKit and the in-org pack remotes, then set it as an org or repo Actions secret named RIGKIT_CI_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DRIGKIT_BUILD_CONTRACT_SMOKE=ON
      - name: Build contract_smoke
        run: cmake --build build --target contract_smoke
      - name: Run CTest
        run: ctest --test-dir build --output-on-failure -R contract_smoke

  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [minimal, oscHost, glEditor]
    steps:
      - name: Require private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::error::Missing secret RIGKIT_CI_TOKEN. Create a fine-grained PAT with Contents:read on rigkid/RigKit and the in-org pack remotes, then set it as an org or repo Actions secret named RIGKIT_CI_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN }}
      - name: Auth private pack remotes for CPM
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${RIGKIT_CI_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev
      - name: Configure ${{ matrix.example }}
        run: >
          cmake -S examples/${{ matrix.example }}
          -B examples/${{ matrix.example }}/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
      - name: Build ${{ matrix.example }}
        run: cmake --build examples/${{ matrix.example }}/build
  # Optional desktop GLES parity. Skips cleanly when ANGLE prebuilts are absent.
  # Never enable on ARM/Pi (CMake fatals). Not required for merge — see docs/contract/pi-host.md.
  # To run: set env RIGKIT_ANGLE_ROOT on the runner (include/ + libGLESv2 + libEGL), or restore a cache.
  angle-gles:
    runs-on: ubuntu-latest
    steps:
      - name: Require private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::error::Missing secret RIGKIT_CI_TOKEN. Create a fine-grained PAT with Contents:read on rigkid/RigKit and the in-org pack remotes, then set it as an org or repo Actions secret named RIGKIT_CI_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN }}
      - name: Auth private pack remotes for CPM
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${RIGKIT_CI_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Resolve ANGLE prebuilts
        id: angle
        env:
          RIGKIT_ANGLE_ROOT: ${{ vars.RIGKIT_ANGLE_ROOT }}
        run: |
          ROOT="${RIGKIT_ANGLE_ROOT:-}"
          if [ -z "$ROOT" ] || [ ! -d "$ROOT/include" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANGLE prebuilts not on runner (set repo/org variable RIGKIT_ANGLE_ROOT). Skipping GLES parity build."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies
        if: steps.angle.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev
      - name: Configure oscHost with ANGLE
        if: steps.angle.outputs.present == 'true'
        run: >
          cmake -S examples/oscHost
          -B examples/oscHost/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRIGKIT_USE_ANGLE=ON
          -DRIGKIT_ANGLE_ROOT=${{ steps.angle.outputs.root }}
      - name: Build oscHost (ANGLE)
        if: steps.angle.outputs.present == 'true'
        run: cmake --build examples/oscHost/build --target oscHost

  plot-family:
    runs-on: ubuntu-latest
    steps:
      - name: Require private-repo CI token
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          if [ -z "$RIGKIT_CI_TOKEN" ]; then
            echo "::error::Missing secret RIGKIT_CI_TOKEN. Create a fine-grained PAT with Contents:read on rigkid/RigKit and the in-org pack remotes, then set it as an org or repo Actions secret named RIGKIT_CI_TOKEN."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RIGKIT_CI_TOKEN }}
      - name: Auth private pack remotes for CPM
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${RIGKIT_CI_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Checkout plot family packs
        env:
          RIGKIT_CI_TOKEN: ${{ secrets.RIGKIT_CI_TOKEN }}
        run: |
          # Host basics are submodules; plot integration packs come from remotes.
          clone_pack() {
            local name="$1"
            if [ ! -f "packs/${name}/CMakeLists.txt" ]; then
              git clone --depth 1 "https://github.com/rigkid/${name}.git" "packs/${name}"
            fi
          }
          clone_pack rigPlotter
          clone_pack rigPlotComponent
          clone_pack rigPlotFinders
          clone_pack rigPlotProcessors
          clone_pack rigPlotGenerators
          clone_pack rigPlotterUi
          clone_pack rigSvg
          clone_pack rigDxf
          clone_pack rigGCode
          clone_pack rigGrbl
          clone_pack rigVectorEditor
          clone_pack rigColorspace
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev
      - name: Configure plot family hero
        run: >
          cmake -S packs/rigPlotter/examples/plot
          -B packs/rigPlotter/examples/plot/build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
      - name: Build plot + unit smokes
        run: >
          cmake --build packs/rigPlotter/examples/plot/build
          --target plot plot_unit_smokes
      - name: Run unit smokes
        run: |
          BUILD=packs/rigPlotter/examples/plot/build
          for smoke in paths_smoke svg_smoke dxf_smoke gcode_smoke gcode_import_smoke potrace_smoke contours_smoke maze_smoke toolpath3d_smoke pipeline_smoke border_smoke grbl_smoke inject_smoke; do
            BIN=$(find "$BUILD" -type f -name "$smoke" -executable | head -1)
            if [ -z "$BIN" ]; then
              echo "::error::missing $smoke"
              exit 1
            fi
            echo "=== $smoke ==="
            "$BIN"
          done
