name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The site is hand-written static files — nothing to build.
      # schemas/json is published at /schemas/ so every schema $id
      # (https://rig.works/schemas/<id>.schema.json) resolves once the
      # custom domain points here.
      - name: Assemble site
        run: |
          mkdir -p _site/schemas
          cp -R site/. _site/
          cp schemas/json/*.schema.json _site/schemas/
          cp llms.txt _site/llms.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
