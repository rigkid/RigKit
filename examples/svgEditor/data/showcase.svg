<?xml version="1.0" encoding="UTF-8"?>
<!--
  "Dawn Hummingbird" - original artwork for the RigWorks svgEditor example.
  Hand-authored low-poly illustration. CC0 / public domain.
  Exercises: layered groups, compound paths with fill-rule="evenodd"
  (sun ring, flower center), strokes, and rgba colors.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="420mm" height="297mm" viewBox="0 0 420 297">
  <g inkscape:label="Sky">
    <!-- Banded dusk sky, dark zenith to warm horizon. -->
    <rect x="0" y="0" width="420" height="78" fill="#241a4a" stroke="none"/>
    <rect x="0" y="78" width="420" height="52" fill="#3d2560" stroke="none"/>
    <rect x="0" y="130" width="420" height="44" fill="#6d3268" stroke="none"/>
    <rect x="0" y="174" width="420" height="36" fill="#a8436e" stroke="none"/>
    <rect x="0" y="210" width="420" height="87" fill="#d96b66" stroke="none"/>
    <circle cx="44" cy="38" r="1.4" fill="rgba(255,255,255,0.8)" stroke="none"/>
    <circle cx="86" cy="22" r="0.9" fill="rgba(255,255,255,0.6)" stroke="none"/>
    <circle cx="128" cy="46" r="1.1" fill="rgba(255,255,255,0.7)" stroke="none"/>
    <circle cx="62" cy="74" r="0.8" fill="rgba(255,255,255,0.5)" stroke="none"/>
    <circle cx="172" cy="26" r="1.2" fill="rgba(255,255,255,0.65)" stroke="none"/>
    <circle cx="222" cy="40" r="0.8" fill="rgba(255,255,255,0.5)" stroke="none"/>
    <circle cx="30" cy="112" r="1.0" fill="rgba(255,255,255,0.45)" stroke="none"/>
    <circle cx="386" cy="30" r="1.1" fill="rgba(255,255,255,0.6)" stroke="none"/>
  </g>

  <g inkscape:label="Sun">
    <circle cx="302" cy="104" r="80" fill="rgba(255,190,110,0.14)" stroke="none"/>
    <circle cx="302" cy="104" r="66" fill="rgba(255,200,120,0.18)" stroke="none"/>
    <circle cx="302" cy="104" r="46" fill="#ffd27a" stroke="none"/>
    <circle cx="302" cy="104" r="34" fill="#ffe9ae" stroke="none"/>
    <circle cx="302" cy="104" r="20" fill="#fff6cf" stroke="none"/>
    <!-- Annulus: both rings share one winding; only evenodd opens the hole. -->
    <path fill-rule="evenodd" fill="rgba(255,235,190,0.6)" stroke="none"
          d="M240 104 A62 62 0 1 1 364 104 A62 62 0 1 1 240 104 Z
             M246 104 A56 56 0 1 1 358 104 A56 56 0 1 1 246 104 Z"/>
  </g>

  <g inkscape:label="Hills">
    <path fill="#2c2350" stroke="none"
          d="M0 232 C60 214 110 224 168 234 C230 244 280 230 340 236 C372 239 400 234 420 228 L420 297 L0 297 Z"/>
    <path fill="#171233" stroke="none"
          d="M0 258 C70 246 130 258 200 264 C270 270 330 258 420 252 L420 297 L0 297 Z"/>
  </g>

  <g inkscape:label="Flora">
    <path fill="none" stroke="#1d4034" stroke-width="3"
          d="M336 297 C330 260 322 232 306 208"/>
    <path fill="#1d4034" stroke="none"
          d="M322 250 C300 238 284 240 270 252 C288 258 308 258 322 250 Z"/>
    <path fill="#1d4034" stroke="none"
          d="M330 236 C348 222 366 222 380 230 C366 242 344 244 330 236 Z"/>
    <path fill="#ff6f61" stroke="none"
          d="M302 198 C292 178 296 162 302 154 C308 162 312 178 302 198 Z"/>
    <path fill="#e85a5f" stroke="none"
          d="M302 198 C320 188 334 186 344 190 C338 200 320 206 302 198 Z"/>
    <path fill="#ff6f61" stroke="none"
          d="M302 198 C318 210 324 222 320 234 C308 228 300 214 302 198 Z"/>
    <path fill="#e85a5f" stroke="none"
          d="M302 198 C296 216 286 226 274 228 C274 216 284 204 302 198 Z"/>
    <path fill="#ff6f61" stroke="none"
          d="M302 198 C284 194 272 186 268 176 C280 172 294 182 302 198 Z"/>
    <!-- Flower center: same-winding double ring, held open by evenodd. -->
    <path fill-rule="evenodd" fill="#ffd166" stroke="none"
          d="M292 198 A10 10 0 1 1 312 198 A10 10 0 1 1 292 198 Z
             M297 198 A5 5 0 1 1 307 198 A5 5 0 1 1 297 198 Z"/>
    <path fill="none" stroke="#ffd166" stroke-width="1.2"
          d="M300 194 C294 190 290 187 287 185"/>
    <circle cx="287" cy="185" r="1.6" fill="#ffe9a8" stroke="none"/>
    <circle cx="292" cy="189" r="1.2" fill="#ffe9a8" stroke="none"/>
    <circle cx="282" cy="176" r="1.1" fill="rgba(255,230,160,0.6)" stroke="none"/>
    <circle cx="276" cy="166" r="0.9" fill="rgba(255,230,160,0.4)" stroke="none"/>
  </g>

  <g inkscape:label="Bird">
    <!-- Wing motion hints -->
    <path fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="2"
          d="M92 52 Q130 28 170 44"/>
    <path fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"
          d="M84 66 Q128 40 174 56"/>
    <!-- Raised wing, three feather slabs -->
    <path fill="#3a2f63" stroke="none" d="M168 126 L96 58 L126 48 Z"/>
    <path fill="#55458f" stroke="none" d="M168 126 L126 48 L152 52 Z"/>
    <path fill="#7a67b5" stroke="none" d="M168 126 L152 52 L172 70 Z"/>
    <path fill="#8f7cc9" stroke="none" d="M168 126 L172 70 L180 100 Z"/>
    <!-- Lower wing blur -->
    <path fill="rgba(122,103,181,0.45)" stroke="none" d="M168 128 L138 112 L178 108 Z"/>
    <!-- Tail feathers -->
    <path fill="#0a4a46" stroke="none" d="M124 178 L150 168 L112 206 Z"/>
    <path fill="#0c5c52" stroke="none" d="M124 178 L112 206 L98 192 Z"/>
    <path fill="#083c38" stroke="none" d="M150 168 L112 206 L134 212 Z"/>
    <!-- Body -->
    <path fill="#0c6e64" stroke="none" d="M152 142 L150 168 L124 178 Z"/>
    <path fill="#b9f5e6" stroke="none" d="M184 146 L152 142 L150 168 Z"/>
    <path fill="#0f8578" stroke="none" d="M176 124 L184 146 L152 142 Z"/>
    <!-- Gorget -->
    <path fill="#e0509a" stroke="none" d="M176 124 L198 126 L184 146 Z"/>
    <path fill="#ff7bb0" stroke="none" d="M184 146 L198 126 L196 142 Z"/>
    <!-- Beak -->
    <path fill="#23233d" stroke="none" d="M216 116 L219 127 L292 189 Z"/>
    <!-- Head -->
    <path fill="#35e0c2" stroke="none" d="M192 104 L216 116 L198 126 Z"/>
    <path fill="#17a89b" stroke="none" d="M192 104 L198 126 L176 124 Z"/>
    <circle cx="203" cy="114" r="2.2" fill="#0d1220" stroke="none"/>
    <circle cx="204" cy="113" r="0.7" fill="#ffffff" stroke="none"/>
  </g>
</svg>
