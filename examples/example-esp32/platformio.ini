; ESP32-S3 sample. Default env is the sign-off image: Wi-Fi page + ESP-NOW.
; esp32s3-audio adds AirPlay and I2S. esp32-a2dp is Classic Bluetooth on the original ESP32.
; This file does not build the desktop engine.

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@7.0.1
framework = arduino
extra_scripts = pre:scripts/pack_web.py
monitor_speed = 115200
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_src_filter = +<main.cpp>
lib_extra_dirs =
	../../firmware
	../../packs
lib_deps =
	fastled/FastLED@3.9.15
	ESP32Async/ESPAsyncWebServer @ ^3.0.0
	ESP32Async/AsyncTCP @ ^3.0.0
build_flags =
	-std=gnu++20
	-Wall
	-DRIGKIT_MCU
	-I../../firmware/esp/include
	-I../../packs/rigEspnow/src

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default.csv
monitor_filters = direct
monitor_rts = 0
monitor_dtr = 0
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DFASTLED_RMT5=0
	-DFASTLED_RMT_BUILTIN_DRIVER=1
	-DRIGKIT_ESP_WIFI
	-DRIGKIT_ESP_ESPNOW
	-DRIGKIT_ESP_STATUS_LED

[env:esp32s3-audio]
extends = env:esp32s3
build_flags =
	${env:esp32s3.build_flags}
	-DRIGKIT_ESP_AIRPLAY
	-DRIGKIT_ESP_I2S

[env:esp32-a2dp]
board = esp32dev
build_flags =
	${env.build_flags}
	-DRIGKIT_ESP_WIFI
	-DRIGKIT_ESP_ESPNOW
	-DRIGKIT_ESP_A2DP
	-DRIGKIT_ESP_I2S
